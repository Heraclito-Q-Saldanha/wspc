name: wspc_release

on:
  push:
    paths:
      - wspc/**
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version bump
        id: version
        uses: ./.github/actions/version-changed
        with:
          manifest-path: wspc/Cargo.toml

      - name: Setup Rust
        if: steps.version.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        if: steps.version.outputs.changed == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cd wspc && cargo publish

      - name: Create git tag
        if: steps.version.outputs.changed == 'true'
        run: |
          git tag wspc-v${{ steps.version.outputs.new_version }}
          git push origin wspc-v${{ steps.version.outputs.new_version }}

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: wspc-v${{ steps.version.outputs.new_version }}
          name: wspc-v${{ steps.version.outputs.new_version }}
          generateReleaseNotes: true
          allowUpdates: true