[package]
name = "wspc"
version = "0.5.0"
description = "`wspc` is a lightweight Rust library for building callback-driven JSON-RPC APIs over WebSockets with Axum."
edition = "2024"
authors = ["Heráclito de Quadros Saldanha <heraclitoqsaldanha@gmail.com>"]
license = "MIT"
keywords = ["wspc", "axum", "json-rpc", "rpc", "websocket"]
readme = "README.md"
repository = "https://github.com/Heraclito-Q-Saldanha/wspc"

[features]
default = ["state"]
state = []

[dependencies]
wspc_derive = { path = "../wspc_derive", version = "0.1.0" }

log = "0.4.34"
axum = { version = "0.8.9", features = ["ws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.25.0", features = ["v4", "serde"] }
tokio = { version = "1.53.1", features = ["sync"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures-util = "0.3.34"
dashmap = "6.2.1"

[dev-dependencies]
simple_logger = "5.2.0"
tokio = { version = "1.53.1", features = ["full"] }
